name: MESA-iOS CI

on:
  # No base-branch filter: stacked pull requests target each other rather than `main`, and a
  # filter of `[ main ]` means every intermediate PR in a stack silently gets no CI at all.
  pull_request:
  push:
    branches: [ main ]

# This is the "Cleanup Crew"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-library:
    name: Library (SPM)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Run Package Tests
        run: swift test --parallel
        working-directory: MESA

  test-app:
    name: iOS App (Sample)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Run App Tests
        run: |
          xcodebuild test \
            -scheme Counter \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=26.2' \
            -quiet
