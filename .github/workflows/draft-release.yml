name: Draft Release

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  draft-release:
    name: Create Draft Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Read version
        id: version
        run: echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Delete existing draft for this version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Passed through the environment rather than interpolated into the script body, so
          # the file's contents can never be parsed as shell.
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          EXISTING=$(gh release list --json tagName,isDraft \
            -q "first(.[] | select(.tagName == \"$VERSION\" and .isDraft) | .tagName) // empty")
          if [ -n "$EXISTING" ]; then
            gh release delete "$EXISTING" --yes
          fi

      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$VERSION" \
            --draft \
            --generate-notes \
            --title "v$VERSION"
